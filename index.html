<!DOCTYPE html>
<html>
<head>
    <title>Online Grocery Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>FreshMart</h1>
        <p>Fresh groceries delivered to your doorstep</p>
    </header>

    <h2>Available Products</h2>

    <div class="products">

        <div class="product">
            <img src="https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6" alt="Apples">
            <h3>Apple</h3>
            <p>Price: ₹120/kg</p>
            <button onclick="addToCart('Apple', 120)">Add to Cart</button>
        </div>

        <div class="product">
            <img src="https://images.unsplash.com/photo-1574226516831-e1dff420e8d8" alt="Bananas">
            <h3>Banana</h3>
            <p>Price: ₹60/dozen</p>
            <button onclick="addToCart('Banana', 60)">Add to Cart</button>
        </div>

        <div class="product">
            <img src="https://images.unsplash.com/photo-1546094096-0df4bcaaa337" alt="Tomatoes">
            <h3>Tomato</h3>
            <p>Price: ₹40/kg</p>
            <button onclick="addToCart('Tomato', 40)">Add to Cart</button>
        </div>

        <div class="product">
            <img src="https://images.unsplash.com/photo-1542838132-92c53300491e" alt="Vegetables">
            <h3>Potato</h3>
            <p>Price: ₹35/kg</p>
            <button onclick="addToCart('Potato', 35)">Add to Cart</button>
        </div>

    </div>

    <h2>Shopping Cart</h2>

    <div id="cart">
        <p>No products added yet.</p>
    </div>

    <h3 id="total">Total: ₹0</h3>

    <script src="script.js"></script>
</body>
</html>
